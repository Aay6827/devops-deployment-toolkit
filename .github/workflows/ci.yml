
name: DevOps Toolkit CI

on:
  push:
    branches:
      - main
    paths:
      - "02-docker/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "02-docker/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test FastAPI and build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-docker/requirements-dev.txt

      - name: Install test dependencies
        working-directory: 02-docker
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        working-directory: 02-docker
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devops-deployment-toolkit:ci ./02-docker
