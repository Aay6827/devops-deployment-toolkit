name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - "06-kubernetes/manifests/**"
      - "07-cicd/**"
      - ".github/workflows/kubernetes-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "06-kubernetes/manifests/**"
      - "07-cicd/**"
      - ".github/workflows/kubernetes-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PyYAML pytest

      - name: Run manifest validation
        run: python 07-cicd/scripts/validate_manifests.py

      - name: Run automated tests
        run: python -m pytest 07-cicd/tests -v