services:
  devops-toolkit-api:
    build:
      context: ../02-docker
      dockerfile: Dockerfile
    container_name: devops-toolkit-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: devops-toolkit-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      devops-toolkit-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: devops-toolkit-grafana
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/devops-toolkit-dashboard.json:/var/lib/grafana/dashboards/devops-toolkit-dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data: